<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ontario Tech — North Campus Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">Ontario Tech <span>North Campus</span></div>
  <div class="divider"></div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search buildings…" autocomplete="off" />
  </div>
  <div class="divider"></div>
  <div class="filters" id="filterBar"></div>
  <button class="admin-login-btn" id="adminLoginBtn" title="Admin login">
    Admin Login
  </button>
</header>

<div class="modal-backdrop hidden" id="loginModalBackdrop">
  <div class="login-modal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
    <button class="login-close-btn" id="loginCloseBtn" aria-label="Close login">✕</button>
    <div class="login-modal-eyebrow">Restricted Access</div>
    <h2 class="login-modal-title" id="loginModalTitle">Admin Login</h2>
    <p class="login-modal-copy">Enter your credentials to unlock admin tools for updating locations and building notices.</p>

    <form class="login-form" id="loginForm">
      <label class="login-label" for="loginUsername">Username</label>
      <input id="loginUsername" class="login-input" type="text" autocomplete="username" />

      <label class="login-label" for="loginPassword">Password</label>
      <input id="loginPassword" class="login-input" type="password" autocomplete="current-password" />

      <div class="login-error" id="loginError"></div>
      <button type="submit" class="login-submit-btn">Sign In</button>
    </form>
  </div>
</div>

<div class="app">
  <div class="map-area" id="mapArea">
    <div id="mapViewport">
      <div id="mapCanvas">
        <img id="mapImage" src="campus.png" alt="Ontario Tech North Campus" draggable="false" />
        <!-- btnLayer sits at 2000x1595, same coord space as the image -->
        <div id="btnLayer"></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-title">Category</div>
      <div class="legend-items" id="legendItems"></div>
    </div>

    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomOut">−</button>
      <button class="zoom-btn" id="zoomReset" title="Reset view" style="font-size:12px">⌂</button>
    </div>

    <div class="result-count" id="resultCount">7 buildings</div>
  </div>

  <div class="side-panel collapsed" id="sidePanel">
    <div id="panelContent"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
